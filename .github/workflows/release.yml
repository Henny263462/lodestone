name: Docker Autobuild & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Build & Push ${{ matrix.image }} (ghcr.io)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [panel, node]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # QEMU braucht nur noch der kurze apk-Schritt im Endimage; kompiliert wird per Cross-Compile auf dem Builder.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Owner to Lowercase
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Generate Docker Tags
        id: meta
        run: |
          IMAGE="ghcr.io/${{ env.OWNER }}/lodestone-${{ matrix.image }}"
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/* ]]; then
            echo "tags=${IMAGE}:latest,${IMAGE}:${REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "version=${REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:main,${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & Push lodestone-${{ matrix.image }} Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            deploy/docker-compose.release.yml
            .env.example
            update.sh
            install.sh
